<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Praktikum Komputasi Awan</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6fa; margin: 0; color: #1f2937; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin-bottom: 4px; }
    .sub { color: #6b7280; margin-top: 0; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-top: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 12px;
                      border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 6px;
             padding: 8px 16px; cursor: pointer; font: inherit; }
    button.hapus { background: #dc2626; padding: 4px 10px; }
    .item { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .item small { color: #6b7280; }
    .badge { display: inline-block; background: #dcfce7; color: #166534;
             padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Halo dari Flask + Docker + Jenkins!</h1>
  <p class="sub">Aplikasi contoh Modul 2 Komputasi Awan
     <span class="badge">database: MySQL @ {{ db_host }}</span></p>

  <div class="card">
    <form method="post" action="{{ url_for('tambah') }}">
      <label>Judul</label>
      <input name="judul" maxlength="100" required placeholder="Contoh: Praktikum Jenkins">
      <label>Isi catatan</label>
      <textarea name="isi" rows="3" placeholder="Tulis catatan..."></textarea>
      <button type="submit">Simpan ke database</button>
    </form>
  </div>

  {% for c in catatan %}
  <div class="card item">
    <div>
      <strong>{{ c.judul }}</strong><br>
      {{ c.isi }}<br>
      <small>{{ c.dibuat_pada }}</small>
    </div>
    <form method="post" action="{{ url_for('hapus', catatan_id=c.id) }}">
      <button class="hapus" type="submit">Hapus</button>
    </form>
  </div>
  {% else %}
  <div class="card">Belum ada catatan. Tambahkan satu di atas.</div>
  {% endfor %}
</main>
</body>
</html>
